<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="app">
        {{ external }} <br>
        {{ intro }}
        <!-- {{ibm_stock}} -->
        <ul>
            <li v-for="stock in ibm_stock">
                {{stock}}
            </li>
        </ul>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.2.0/vue.js">

    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.25.0/axios.js"></script>
    <script>
        new Vue({
            el: "#app",
            data: {
                external: "Testing APIs",
                intro: "Welcome to html ",
                ibm_stock: []
            },
            methods: {
                intro_method() {
                    this.intro = "Updated by method"
                },
                async imb_stock_call() {
                    const results = await axios.get("https://www.alphavantage.co/query?function=TIME_SERIES_INTRADAY&symbol=IBM&interval=5min&apikey=demo")
                    console.log(results.data["Time Series (5min)"])
                    this.ibm_stock = results.data["Time Series (5min)"]
                }


            },
            mounted() {
                this.intro_method();
                this.imb_stock_call();
            }
        });
    </script>
</body>

</html>
