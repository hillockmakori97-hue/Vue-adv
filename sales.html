<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/3.1.3/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.8/css/bootstrap.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                    <a class="nav-link" href="#">Features</a>
                    <a class="nav-link" href="#">Pricing</a>
                    <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                </div>
            </div>
        </div>
    </nav>
    <div id="app">
        <table id="example" class="table table-striped">
            <thead>
                <tr>
                    <th>Sale_id</th>
                    <th>User_id</th>
                    <th>Date Sold</th>
                </tr>
            </thead>
            <tbody>
            <tbody>
                <tr v-for="i in res">
                    <td>{{ i.id }}</td>
                    <td>{{ i.user_id }}</td>
                    <td>{{ i.date_sold }}</td>
                </tr>
            </tbody>
            </tbody>
        </table>
        <!-- Button trigger modal -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Add Sale
        </button>

        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form @submit.prevent="add_sale">

                            <div class="mb-3">
                                <label for="userIdInput" class="form-label">User Id</label>
                                <input type="text" v-model="userId" class="form-control" id="userIdInput" required>
                            </div>

                            <div class="mb-3">
                                <label for="dateSoldInput" class="form-label">Date Sold</label>
                                <input type="date" v-model="dateSold" class="form-control" id="dateSoldInput" required>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <!-- Adding data-bs-dismiss="modal" directly to the submit button -->
                                <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">Save
                                    changes</button>
                            </div>

                        </form>
                    </div>

                </div>


            </div>
        </div>
    </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/3.1.3/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/3.1.3/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        new Vue({
            'el': '#app',
            data: {
                salesStock: [],
                SaleId: '',
                userId: '',
                dateSold: '',
                alertMessage: '',
                alertSuccessShow: false,
                alertDangerShow: false,
                res: []
            },
            methods: {
                headers() {
                    return {
                        Authorization: `Bearer ${localStorage.getItem('token')}`
                    }
                },
                async salesStockCall() {
                    try {
                        const results = await axios.get('http://127.0.0.1:5000/sales', { headers: this.headers() })
                        this.res = results.data
                        // console.log(results)
                        console.log(this.res)
                    }
                    catch (error) {
                        if (error.response) {
                            const status = error.response.status
                            const message = error.response.data?.message || error.response.data
                            if (status === 401) {
                                console.log(message)
                            } else if (status === 404) {
                                console.log(message)
                            } else {
                                console.log(message)
                            }
                        }
                    }

                },
                async add_sale() {
                    try {
                        if (this.userId && this.dateSold) {
                            await axios.post('http://127.0.0.1:5000/sales', {
                                user_id: this.userId,
                                date_sold: this.dateSold

                            },{
                                headers:this.headers()
                            })
                            this.alertSuccessShow = true
                            this.alertMessage = "Sale Added Successfully"
                            await this.salesStockCall()
                        }
                    } catch (error) {

                    }


                }

            },
            mounted() {
                this.salesStockCall()
            }

        },

        );
    </script>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>


</html>
