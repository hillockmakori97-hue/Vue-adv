<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div id="app" class="container mt-5" style="max-width: 500px;">
        <form @submit.prevent="register_user">
            <div class="mb-3">
                <label for="regName" class="form-label">Full Name</label>
                <input type="text" v-model="full_name" class="form-control" id="regName" placeholder="Jane Doe" required>
            </div>
            <div class="mb-3">
                <label for="regEmail" class="form-label">Email address</label>
                <input type="email" v-model="email" class="form-control" id="regEmail" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <input type="password" v-model="password" class="form-control" id="regPassword" placeholder="Create a password" required>
            </div>
            
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                <label class="form-check-label" for="agreeTerms">
                    I agree to the <a href="#" class="text-decoration-none">Terms of Service</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Create Account</button>

            <div class="alert alert-success mt-3" v-if="alertSuccessShow">
                {{ alertMessage }}
            </div>
            <div class="alert alert-danger mt-3" v-if="alertDangerShow">
                {{ alertMessage }}
            </div>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>


    <script>
        new Vue({
            el: "#app",
            data: {
                full_name: "",
                email: "",
                password: "",
                alertMessage: "",
                alertSuccessShow: false,
                alertDangerShow: false
            },
            methods: {
                register_user() {
                    this.alertSuccessShow = false;
                    this.alertDangerShow = false;

                    if (this.full_name === "" || this.email === "" || this.password === "") {
                        this.alertDangerShow = true;
                        this.alertMessage = "Ensure all fields are filled";
                        return;
                    }

                    axios.post("http://127.0.0.1:5000/register", {
                        full_name: this.full_name,
                        email: this.email,
                        password: this.password
                    })
                    .then((response) => {
                        this.alertDangerShow = false;
                        this.alertSuccessShow = true;
                        this.alertMessage = "User registered successfully";

                        localStorage.setItem("token", response.data.token);
                        window.location.href = "index.html";
                    })
                    .catch((error) => {
                        this.alertSuccessShow = false;
                        this.alertDangerShow = true;
                        
                
                        const serverError = error.response?.data;
                        this.alertMessage = serverError?.error || serverError?.Error || serverError?.message || "Registration failed";
                    });
                }
            },
            mounted() {
                if (localStorage.getItem("token") !== null) {
                    // window.location.href = "index.html";
                }
            }
        });
    </script>
</body>

</html>
